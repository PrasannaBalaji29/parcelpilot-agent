services:
  - type: web
    name: parcelpilot-agent-backend
    runtime: python
    rootDir: backend
    buildCommand: "pip install -r requirements.txt && pip install sentence-transformers && python run_ingest.py"
    startCommand: "gunicorn -w 2 --timeout 120 -b 0.0.0.0:$PORT app.main:app"
    envVars:
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_MODEL
        value: openai/gpt-oss-120b
